<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Left-aligned Header</title>
    <style>
        /* Reset styles */
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* Layout styles */
        body {
            display: flex;
        }

        header {
            width: 200px; /* 헤더의 너비 */
            height: 100vh; /* 전체 화면 높이 */
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        header .image-container {
            margin-bottom: 20px;
        }

        header img {
            width: 100px; /* 로고 크기 */
            margin-bottom: 20px;
        }

        header a {
            text-decoration: none;
            margin: 10px 0;
            display: block;
        }

        .content {
            flex-grow: 1;
            padding: 20px;
        }

        .card img {
            width: 150px;
            margin: 10px;
        }

        footer {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="image-container">
            <img src="C:\Users\LG\Desktop\myproject\my_flask\app\static\images\예스메이트!.png" alt="Example JPG">

        </a>

        <!-- 추가 링크 섹션 -->
        <a href="https://example.com/admin" target="_blank">Admin</a>
        <a href="https://example.com/worker" target="_blank">Worker</a>
